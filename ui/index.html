<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reshelf - Review Proposal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="app-header">
    <h1>Reshelf</h1>
    <button id="retry-btn" hidden>Retry</button>
    <span id="session-status"></span>
  </header>

  <div id="session-history" hidden>
    <label>Past sessions
      <select id="session-history-select"></select>
    </label>
  </div>

  <div id="filters">
    <label><input type="checkbox" id="filter-needs-review" /> Needs review only</label>
    <label><input type="checkbox" id="filter-ambiguous" /> Ambiguous match only</label>
  </div>

  <main id="main-layout">
    <aside id="release-list"></aside>

    <section id="detail-panel" hidden>
      <div id="save-row-top">
        <button id="save-btn-top" class="save-btn">Save</button>
        <span id="unsaved-count-top" class="unsaved-count"></span>
      </div>

      <h2 id="detail-title"></h2>

      <table id="before-after-table">
        <thead>
          <tr><th id="before-after-before-header">Before</th><th>After</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="release-fields">
        <label>Artist / Album Artist
          <input type="text" id="field-artist" />
        </label>
        <label>Album
          <input type="text" id="field-album" />
        </label>
        <label>Year
          <input type="number" id="field-year" />
        </label>
        <label>Artist Folder Name
          <input type="text" id="field-artist-folder" />
        </label>
        <label>Release Folder Name
          <input type="text" id="field-release-folder" />
        </label>
      </div>

      <table id="track-fields-table">
        <thead>
          <tr><th>Disc</th><th>Track</th><th>Title</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Other files</h3>
      <table id="companion-table">
        <thead>
          <tr><th>Include</th><th>Before</th><th>After</th><th>Kind</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="companion-empty" hidden>No other files</p>

      <div id="cover-gallery"></div>

      <div id="manual-cover-row">
        <label for="manual-cover-input" id="manual-cover-btn" class="button-like">Add cover from file…</label>
        <input type="file" id="manual-cover-input" accept="image/png,image/jpeg" hidden />
        <span id="manual-cover-status"></span>
      </div>

      <div id="discogs-candidates" hidden>
        <h3>Discogs match is ambiguous - pick the correct edition</h3>
        <div id="discogs-candidates-list"></div>
      </div>

      <label>Notes
        <textarea id="notes-field"></textarea>
      </label>

      <label><input type="checkbox" id="approve-checkbox" /> Approve</label>
      <label><input type="checkbox" id="reject-checkbox" /> Reject (never apply - e.g. a duplicate pressing you don't want)</label>

      <div id="save-row">
        <button id="save-btn" class="save-btn">Save</button>
        <span id="unsaved-count" class="unsaved-count"></span>
        <span id="save-status"></span>
      </div>
    </section>
  </main>

  <dialog id="cover-modal">
    <img id="cover-modal-img" alt="" />
    <button id="cover-modal-close" type="button">X</button>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
